```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Needle — 404</title>
<link rel="icon" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eae7df;
  --ink-dim:#9a968b;
  --ink-faint:#5c584e;
  --bg:#0c0b09;
  --bg-raised:#141310;
  --line:#2a271e;
  --needle:#ff4b2e;
  --needle-dim:#7a2517;
  --thread:#d9c98a;
  --mono:'JetBrains Mono',monospace;
  --display:'Fraunces',serif;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,75,46,.08),transparent),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.012) 0,
      rgba(255,255,255,.012) 1px,
      transparent 1px,
      transparent 3px
    );
}

::selection{
  background:var(--needle);
  color:#100;
}

.shell{
  width:100%;
  max-width:760px;
}

.card{
  position:relative;
  overflow:hidden;
  padding:54px;
  border:1px solid var(--line);
  background:rgba(20,19,16,.86);
  opacity:0;
  transform:translateY(10px);
  animation:rise .65s ease forwards;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:2px;
  background:var(--needle);
  transform:scaleX(0);
  transform-origin:left;
  animation:line .8s ease .35s forwards;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:62px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.brand h1{
  margin:0;
  font-family:var(--display);
  font-size:32px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.02em;
}

.brand h1 span{
  color:var(--needle);
}

.tagline{
  margin-top:6px;
  color:var(--ink-faint);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.error{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  color:var(--needle);
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.error::before{
  content:"";
  width:22px;
  height:1px;
  background:var(--needle-dim);
}

.code{
  margin:0;
  font-family:var(--display);
  font-size:96px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-.06em;
  color:var(--ink);
}

.code span{
  color:var(--needle);
}

h2{
  margin:24px 0 12px;
  font-family:var(--display);
  font-size:28px;
  font-weight:600;
  letter-spacing:-.02em;
}

.message{
  max-width:560px;
  margin:0;
  color:var(--ink-dim);
  font-size:13px;
  line-height:1.8;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:30px;
}

.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border:1px solid var(--line);
  background:var(--bg-raised);
  color:var(--ink-dim);
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.07em;
  text-decoration:none;
  text-transform:uppercase;
  transition:.15s ease;
}

.button:hover{
  border-color:var(--needle-dim);
  color:var(--needle);
  background:#181510;
}

.button.primary{
  border-color:var(--needle-dim);
  color:var(--needle);
}

.button.primary:hover{
  border-color:var(--needle);
  background:rgba(255,75,46,.06);
}

.footer{
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--ink-faint);
  font-size:10px;
  line-height:1.8;
  text-align:center;
  letter-spacing:.04em;
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes line{
  from{
    transform:scaleX(0);
  }
  to{
    transform:scaleX(1);
  }
}

@media(max-width:600px){
  body{
    padding:14px;
  }

  .card{
    padding:36px 26px;
  }

  .brand{
    margin-bottom:48px;
  }

  .code{
    font-size:72px;
  }

  h2{
    font-size:24px;
  }

  .actions{
    flex-direction:column;
  }

  .button{
    width:100%;
  }
}
</style>
</head>
<body>
<div class="shell">
  <main class="card">
    <div class="brand">
      <img src="Logo.svg" alt="Needle" onerror="this.onerror=null;this.src='Logo.png'">
      <div>
        <h1>Needle<span>.</span></h1>
        <div class="tagline">Find it in the haystack</div>
      </div>
    </div>

    <div class="error">Signal not found</div>

    <div class="code">4<span>0</span>4</div>

    <h2>This page doesn't exist.</h2>

    <p class="message">
      The needle you're looking for isn't here. The page may have been
      moved, removed, or the address may be incorrect.
    </p>

    <div class="actions">
      <a class="button primary" href="/">Return home</a>
      <a class="button" href="https://needleosint.lol/">Needle OSINT</a>
    </div>

    <div class="footer">
      Needle OSINT · Find it in the haystack.
    </div>
  </main>
</div>
</body>
</html>
