<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Needle — Sign in</title><link rel="icon" href="Logo.png"><link rel="stylesheet" href="auth.css"><script src="auth.js"></script></head>
<body><main class="auth-card"><img src="Logo.png" alt="Needle logo" class="auth-logo"><p class="eyebrow">NEEDLE OSINT · AUTHORIZED ACCESS</p><h1>Sign in</h1><p class="muted">An account is required before accessing Needle.</p><form id="authForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><div id="turnstile"></div><p class="error" id="error" role="alert"></p><button id="submit" type="submit" disabled>Loading security check…</button></form><p class="switch">New here? <button class="link" id="switch" type="button">Create an account</button></p><p class="fineprint">By continuing, you confirm you are authorized to use this tool. Access is logged and may be revoked.</p></main><script>
const form=document.querySelector('#authForm'), title=document.querySelector('h1'), switcher=document.querySelector('#switch'), submit=document.querySelector('#submit'), error=document.querySelector('#error'); let signup=false;
switcher.onclick=()=>{signup=!signup; title.textContent=signup?'Create an account':'Sign in'; submit.textContent=signup?'Create account':'Sign in'; switcher.textContent=signup?'Sign in instead':'Create an account'; document.querySelector('#password').autocomplete=signup?'new-password':'current-password'; error.textContent=''};
let turnstileToken='';
NeedleAuth.getPublicConfig().then(config=>{if(!config.turnstileSiteKey)throw new Error('Turnstile is not configured.');const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.onload=()=>turnstile.render('#turnstile',{sitekey:config.turnstileSiteKey,theme:'dark',callback:token=>{turnstileToken=token;submit.disabled=false;submit.textContent=signup?'Create account':'Sign in'},'expired-callback':()=>{turnstileToken='';submit.disabled=true}});document.head.appendChild(script)}).catch(err=>{error.textContent=err.message;submit.textContent='Security check unavailable'});
form.onsubmit=async e=>{e.preventDefault(); error.textContent='';if(!turnstileToken){error.textContent='Complete the security check.';return}submit.disabled=true;try{const email=document.querySelector('#email').value,password=document.querySelector('#password').value,result=signup?await NeedleAuth.register(email,password,turnstileToken):await NeedleAuth.login(email,password,turnstileToken);if(signup){error.style.color='var(--muted)';error.textContent=result.message;return}const next=new URLSearchParams(location.search).get('next');location.replace(next&&!next.includes('://')?next:'index.html')}catch(err){error.textContent=err.message;if(window.turnstile){turnstile.reset();turnstileToken=''}}finally{submit.disabled=false}};
</script></body></html>
