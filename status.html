```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Needle — System Status</title>
<link rel="icon" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eae7df;
  --dim:#9a968b;
  --faint:#5c584e;
  --bg:#0c0b09;
  --raised:#141310;
  --line:#2a271e;
  --red:#ff4b2e;
  --red-dim:#7a2517;
  --green:#7fae6e;
  --yellow:#d9c98a;
  --mono:'JetBrains Mono',monospace;
  --display:'Fraunces',serif;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100vh;
  padding:28px;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,75,46,.08),transparent),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.012) 0,
      rgba(255,255,255,.012) 1px,
      transparent 1px,
      transparent 3px
    );
}

.shell{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:40px 0 70px;
}

header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
  opacity:0;
  transform:translateY(8px);
  animation:rise .6s ease forwards;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.brand h1{
  margin:0;
  font-family:var(--display);
  font-size:32px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.02em;
}

.brand h1 span{
  color:var(--red);
}

.tagline{
  margin-top:6px;
  color:var(--faint);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.updated{
  color:var(--faint);
  font-size:10px;
  text-align:right;
  line-height:1.7;
}

.overall{
  margin-top:34px;
  padding:24px;
  border:1px solid var(--line);
  background:var(--raised);
  display:flex;
  align-items:center;
  gap:18px;
  opacity:0;
  transform:translateY(8px);
  animation:rise .6s ease .1s forwards;
}

.overall-dot{
  width:12px;
  height:12px;
  flex:none;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px rgba(127,174,110,.35);
}

.overall.warning .overall-dot{
  background:var(--yellow);
  box-shadow:0 0 16px rgba(217,201,138,.25);
}

.overall.down .overall-dot{
  background:var(--red);
  box-shadow:0 0 16px rgba(255,75,46,.3);
}

.overall h2{
  margin:0;
  font-family:var(--display);
  font-size:23px;
  font-weight:600;
}

.overall p{
  margin:4px 0 0;
  color:var(--faint);
  font-size:11px;
}

.section-title{
  margin:42px 0 12px;
  color:var(--faint);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.services{
  display:flex;
  flex-direction:column;
  border:1px solid var(--line);
}

.service{
  display:grid;
  grid-template-columns:1fr auto;
  gap:20px;
  align-items:center;
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(20,19,16,.55);
  transition:background .15s ease;
}

.service:last-child{
  border-bottom:none;
}

.service:hover{
  background:var(--raised);
}

.service-name{
  font-size:13px;
  font-weight:600;
  color:var(--ink);
}

.service-description{
  margin-top:5px;
  color:var(--faint);
  font-size:10px;
}

.service-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.service-status{
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--green);
}

.service-status.warning{
  color:var(--yellow);
}

.service-status.down{
  color:var(--red);
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
}

.dot.warning{
  background:var(--yellow);
}

.dot.down{
  background:var(--red);
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-top:22px;
}

.refresh-info{
  color:var(--faint);
  font-size:10px;
}

button{
  border:1px solid var(--line);
  background:var(--raised);
  color:var(--dim);
  padding:10px 14px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.07em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.15s ease;
}

button:hover{
  border-color:var(--red-dim);
  color:var(--red);
}

footer{
  margin-top:45px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--faint);
  font-size:10px;
  line-height:1.8;
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:650px){
  body{padding:16px}
  .shell{padding-top:20px}
  header{align-items:flex-start;flex-direction:column}
  .updated{text-align:left}
  .overall{padding:20px}
  .service{grid-template-columns:1fr}
  .service-right{justify-content:flex-start}
  .controls{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="shell">

<header>
  <div class="brand">
    <img src="Logo.svg" alt="Needle" onerror="this.onerror=null;this.src='Logo.png'">
    <div>
      <h1>Needle<span>.</span></h1>
      <div class="tagline">Find it in the haystack</div>
    </div>
  </div>
  <div class="updated">
    LAST CHECK<br>
    <span id="lastCheck">Checking...</span>
  </div>
</header>

<section class="overall" id="overall">
  <div class="overall-dot"></div>
  <div>
    <h2 id="overallTitle">Checking systems...</h2>
    <p id="overallText">Needle is checking all monitored services.</p>
  </div>
</section>

<div class="section-title">Monitored services</div>

<section class="services" id="services"></section>

<div class="controls">
  <div class="refresh-info">Automatic checks every 30 seconds</div>
  <button id="refresh">Check now</button>
</div>

<footer>
  Needle OSINT · System status<br>
  If something looks wrong, wait a moment and check again.
</footer>

</div>

<script>
const checks=[
  {
    name:'Needle Website',
    description:'Main website availability',
    url:'/'
  },
  {
    name:'Robots.txt',
    description:'Search engine crawler configuration',
    url:'/robots.txt'
  },
  {
    name:'Sitemap',
    description:'Search engine sitemap',
    url:'/sitemap.xml'
  },
  {
    name:'Needle Logo',
    description:'Primary site branding asset',
    url:'/Logo.svg'
  },
  {
    name:'Main-1.json',
    description:'Indexed data segment',
    url:'/Main-1.json'
  },
  {
    name:'Main-2.json',
    description:'Indexed data segment',
    url:'/Main-2.json'
  },
  {
    name:'Main-3.json',
    description:'Indexed data segment',
    url:'/Main-3.json'
  },
  {
    name:'Main-4.json',
    description:'Indexed data segment',
    url:'/Main-4.json'
  },
  {
    name:'Main-5.json',
    description:'Indexed data segment',
    url:'/Main-5.json'
  }
];

const services=document.getElementById('services');
const overall=document.getElementById('overall');
const overallTitle=document.getElementById('overallTitle');
const overallText=document.getElementById('overallText');
const lastCheck=document.getElementById('lastCheck');
const refresh=document.getElementById('refresh');

function renderLoading(){
  services.innerHTML=checks.map(check=>`
    <div class="service">
      <div>
        <div class="service-name">${check.name}</div>
        <div class="service-description">${check.description}</div>
      </div>
      <div class="service-right">
        <div class="dot warning"></div>
        <div class="service-status warning">Checking</div>
      </div>
    </div>
  `).join('');
}

async function checkService(check){
  const start=performance.now();

  try{
    const response=await fetch(check.url,{
      method:'GET',
      cache:'no-store'
    });

    const time=Math.round(performance.now()-start);

    if(!response.ok){
      return{
        ...check,
        status:'down',
        label:'Down',
        time,
        code:response.status
      };
    }

    return{
      ...check,
      status:'up',
      label:'Operational',
      time,
      code:response.status
    };
  }catch(error){
    return{
      ...check,
      status:'down',
      label:'Down',
      time:null,
      code:null
    };
  }
}

function renderResults(results){
  services.innerHTML=results.map(result=>`
    <div class="service">
      <div>
        <div class="service-name">${result.name}</div>
        <div class="service-description">${result.description}</div>
      </div>
      <div class="service-right">
        <div class="dot ${result.status}"></div>
        <div class="service-status ${result.status}">
          ${result.label}${result.time !== null ? ` · ${result.time}ms` : ''}
        </div>
      </div>
    </div>
  `).join('');

  const failed=results.filter(result=>result.status==='down').length;

  overall.className='overall';

  if(failed===0){
    overallTitle.textContent='All systems operational';
    overallText.textContent='Needle is running normally.';
  }else if(failed<results.length){
    overall.classList.add('warning');
    overallTitle.textContent='Some systems are degraded';
    overallText.textContent=`${failed} of ${results.length} monitored services need attention.`;
  }else{
    overall.classList.add('down');
    overallTitle.textContent='Major service disruption';
    overallText.textContent='Needle is currently experiencing widespread problems.';
  }

  const now=new Date();

  lastCheck.textContent=now.toLocaleTimeString([],{
    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit'
  });
}

async function runChecks(){
  refresh.disabled=true;
  refresh.textContent='Checking...';

  renderLoading();

  const results=await Promise.all(checks.map(checkService));

  renderResults(results);

  refresh.disabled=false;
  refresh.textContent='Check now';
}

refresh.addEventListener('click',runChecks);

renderLoading();
runChecks();
setInterval(runChecks,30000);
</script>
</body>
</html>
