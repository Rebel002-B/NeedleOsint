<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #eae7df;
    --ink-dim: #9a968b;
    --ink-faint: #5c584e;
    --bg: #0c0b09;
    --bg-raised: #141310;
    --line: #2a271e;
    --needle: #ff4b2e;
    --needle-dim: #7a2517;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Fraunces', serif;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  body{
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,75,46,0.07), transparent),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    display:flex;
    align-items:center;
    min-height:100vh;
  }
  ::selection{ background: var(--needle); color: #100; }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 28px;
    display:flex;
    align-items:center;
    gap: 64px;
    width:100%;
  }

  .left{
    flex: 1;
    opacity:0;
    animation: rise .7s ease forwards;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color: var(--needle);
    margin-bottom: 22px;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--needle);
    animation: pulse 1.6s ease-in-out infinite;
  }

  h1.title{
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(40px, 6vw, 68px);
    letter-spacing: -0.02em;
    line-height: 1.02;
    margin: 0 0 22px;
    color: var(--ink);
  }
  h1.title .strike{
    position:relative;
    color: var(--ink-dim);
  }

  .reason{
    display:inline-flex;
    align-items:baseline;
    gap:10px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    border-radius: 2px;
    padding: 12px 18px;
    margin-bottom: 28px;
  }
  .reason .k{
    font-size: 10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: var(--ink-faint);
  }
  .reason .v{
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
    color: var(--thread, #d9c98a);
    color: #d9c98a;
  }

  p.body{
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--ink-dim);
    max-width: 460px;
    margin: 0 0 30px;
  }

  .meta{
    display:flex;
    gap: 28px;
    flex-wrap:wrap;
  }
  .meta .stat .n{
    font-family: var(--display);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .meta .stat .l{
    font-size: 9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--ink-faint);
    margin-top:3px;
  }

  .right{
    flex: none;
    width: 340px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    animation: rise .7s ease forwards .1s;
  }

  .xmark{
    width: 260px;
    height: 260px;
  }
  .xmark line{
    stroke: var(--needle);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 210;
    stroke-dashoffset: 210;
    animation: draw 1s cubic-bezier(.65,0,.35,1) forwards;
    filter: drop-shadow(0 0 14px rgba(255,75,46,0.35));
  }
  .xmark line.l2{ animation-delay: .25s; }
  .xmark circle{
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
  }
  .xmark circle.spin{
    stroke: var(--needle-dim);
    stroke-dasharray: 4 10;
    transform-origin: 50% 50%;
    animation: spin 12s linear infinite;
  }

  .footer-note{
    position:absolute;
    bottom: 28px;
    left:0; right:0;
    text-align:center;
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing:.04em;
  }

  @keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform: translateY(0);} }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes spin{ from{ transform: rotate(0deg);} to{ transform: rotate(360deg);} }

  @media (max-width: 860px){
    .wrap{ flex-direction:column-reverse; gap: 36px; text-align:center; }
    .left{ display:flex; flex-direction:column; align-items:center; }
    p.body{ max-width: 100%; }
    .meta{ justify-content:center; }
    .right{ width: 220px; }
    .xmark{ width: 200px; height:200px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="eyebrow"><span class="dot"></span> Service Interruption</div>
      <h1 class="title">Under<br>maintenance<span class="strike">.</span></h1>
      <div class="reason">
        <span class="k">Reason</span>
        <span class="v">Unknown</span>
      </div>
      <p class="body">This page is temporarily offline while things get sorted out. Nothing to do on your end — check back shortly.</p>
      <div class="meta">
        <div class="stat">
          <div class="n" id="clock">--:--:--</div>
          <div class="l">Local Time</div>
        </div>
        <div class="stat">
          <div class="n">—</div>
          <div class="l">ETA</div>
        </div>
        <div class="stat">
          <div class="n" style="color:var(--needle)">OFFLINE</div>
          <div class="l">Status</div>
        </div>
      </div>
    </div>
    <div class="right">
      <svg class="xmark" viewBox="0 0 100 100">
        <circle class="spin" cx="50" cy="50" r="46"></circle>
        <circle cx="50" cy="50" r="38"></circle>
        <line class="l1" x1="32" y1="32" x2="68" y2="68"></line>
        <line class="l2" x1="68" y1="32" x2="32" y2="68"></line>
      </svg>
    </div>
  </div>
  <div class="footer-note">Automatically refreshes when service resumes</div>
  <script>
    function tick(){
      document.getElementById('clock').textContent = new Date().toLocaleTimeString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
