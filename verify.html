<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Needle — Verify email</title><link rel="stylesheet" href="auth.css"><script src="auth.js"></script></head><body><main class="auth-card"><p class="eyebrow">NEEDLE OSINT · ACCOUNT VERIFICATION</p><h1 id="title">Verifying your email…</h1><p class="muted" id="message">Please wait.</p><a id="login" href="login.html" hidden>Continue to sign in</a></main><script>(async()=>{const token=new URLSearchParams(location.search).get('token');const title=document.querySelector('#title'),message=document.querySelector('#message'),login=document.querySelector('#login');if(!token){title.textContent='Invalid verification link';message.textContent='The link is missing its verification token.';return}try{await NeedleAuth.verify(token);title.textContent='Email verified';message.textContent='Your Needle account is active. You can now sign in.';login.hidden=false}catch(error){title.textContent='Verification failed';message.textContent=error.message}})();</script></body></html>
